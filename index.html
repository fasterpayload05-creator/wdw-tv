<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDW Resort TV - Full Attractions</title>
    <style>
        :root { --disney-blue: #002266; --disney-gold: #FFCC00; --open-green: #00FF88; --closed-red: #FF4444; }
        body { margin: 0; background: var(--disney-blue); color: white; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; }
        
        .header { width: 100%; border-bottom: 6px solid var(--disney-gold); background: #003399; display: flex; justify-content: space-between; padding: 20px 40px; box-sizing: border-box; align-items: center; }
        .logo { font-size: 42px; font-weight: 900; letter-spacing: 2px; }
        .clock { font-size: 38px; color: var(--disney-gold); font-weight: bold; }

        .main-grid { display: flex; padding: 30px; height: calc(100vh - 200px); gap: 40px; }
        .left-col { width: 60%; border-right: 4px solid var(--disney-gold); position: relative; display: flex; flex-direction: column; padding-right: 20px; }
        .right-col { width: 40%; display: flex; flex-direction: column; }

        .section-title { color: var(--disney-gold); font-size: 32px; font-weight: bold; border-bottom: 4px solid var(--disney-gold); margin-bottom: 15px; text-transform: uppercase; }
        
        .scroll-window { flex-grow: 1; position: relative; overflow: hidden; mask-image: linear-gradient(to bottom, transparent, black 8%, black 92%, transparent); }
        #wait-list { position: absolute; width: 100%; top: 0; will-change: transform; transition: transform 0.1s linear; }
        
        .wait-item { border-bottom: 1px solid rgba(255,255,255,0.15); padding: 12px 0; font-size: 24px; display: flex; justify-content: space-between; align-items: center; }
        .wait-val { color: var(--disney-gold); font-weight: 800; text-align: right; min-width: 120px; }

        .status-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 16px; font-weight: 900; text-transform: uppercase; border: 2px solid currentColor; }
        .is-open { color: var(--open-green); }
        .is-closed { color: var(--closed-red); opacity: 0.6; }

        .footer { position: fixed; bottom: 10px; right: 20px; font-size: 12px; opacity: 0.6; color: var(--disney-gold); }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">WALT DISNEY WORLD</div>
        <div id="p-clock" class="clock">--:--</div>
    </div>
    <div class="main-grid">
        <div class="left-col">
            <div class="section-title" id="p-name">SYNCING...</div>
            <div class="scroll-window"><div id="wait-list">Initializing Full Roster...</div></div>
        </div>
        <div class="right-col">
            <div class="section-title">PARK STATUS</div>
            <div id="status-disp">Calculating...</div>
        </div>
    </div>
    <div class="footer" id="last-update">Network Status: Online</div>

    <script>
        const PROXY = "https://api.allorigins.win/raw?url=";
        const parks = [
            {
                id:6, n:"Magic Kingdom", wiki:"75ea578a-adc8-4116-a54d-dccb60765ef9", 
                backup: ["TRON Lightcycle Run", "Seven Dwarfs Mine Train", "Space Mountain", "Big Thunder Mountain", "Tiana's Bayou Adventure", "Jungle Cruise", "Peter Pan's Flight", "Haunted Mansion", "Pirates of the Caribbean", "Buzz Lightyear", "It's a Small World", "Many Adventures of Winnie the Pooh", "Under the Sea: Ariel", "The Barnstormer", "Dumbo the Flying Elephant", "Mad Tea Party", "Tomorrowland Speedway", "Astro Orbiter", "PeopleMover", "Prince Charming Regal Carrousel", "Magic Carpets of Aladdin", "Enchanted Tiki Room", "Country Bear Musical Jamboree", "Mickey's PhilharMagic", "Hall of Presidents", "Liberty Square Riverboat", "Tom Sawyer Island"]
            }, 
            {
                id:5, n:"EPCOT", wiki:"47f90d2c-e191-4239-a466-5892ef59a88b", 
                backup: ["Guardians: Cosmic Rewind", "Remy's Ratatouille Adventure", "Frozen Ever After", "Test Track", "Soarin' Around the World", "Spaceship Earth", "Mission: SPACE", "Journey into Imagination", "Living with the Land", "The Seas with Nemo & Friends", "Turtle Talk with Crush", "Gran Fiesta Tour", "Awesome Planet", "Canada Far and Wide", "Disney and Pixar Short Film Festival", "Impressions de France", "Reflections of China", "Beauty and the Beast Sing-Along"]
            }, 
            {
                id:7, n:"Hollywood Studios", wiki:"288747d1-8b4f-4a4a-9897-5363d5fef940", 
                backup: ["Star Wars: Rise of the Resistance", "Slinky Dog Dash", "Mickey & Minnie's Runaway Railway", "Tower of Terror", "Rock 'n' Roller Coaster", "Millennium Falcon: Smugglers Run", "Toy Story Mania!", "Star Tours", "Alien Swirling Saucers", "Indiana Jones Stunt Spectacular", "Beauty & the Beast Live on Stage", "Disney Junior Play & Dance!", "For the First Time in Forever: Frozen Sing-Along", "Muppet*Vision 3D", "Lightning McQueen's Racing Academy", "Walt Disney Presents"]
            }, 
            {
                id:8, n:"Animal Kingdom", wiki:"1c8a40f3-d096-48d8-9419-f9c1186e885a", 
                backup: ["Avatar Flight of Passage", "Na'vi River Journey", "Expedition Everest", "Kilimanjaro Safaris", "DINOSAUR", "Kali River Rapids", "It's Tough to be a Bug!", "TriceraTop Spin", "Festival of the Lion King", "Finding Nemo: The Big Blue... and Beyond!", "Feathered Friends in Flight!", "Gorilla Falls Exploration Trail", "Maharajah Jungle Trek", "Wildlife Express Train"]
            }
        ];
        
        let curIdx = -1;
        let resortData = { status: {}, rides: {} };
        let scrollY = 0;
        let direction = -1;
        let isPaused = false;

        async function syncData() {
            const cb = "&cb=" + Date.now();
            for (let p of parks) {
                let ridesHTML = "";
                try {
                    const sUrl = encodeURIComponent(`https://api.themeparks.wiki/v1/entity/${p.wiki}/live`);
                    const sRes = await fetch(PROXY + sUrl + cb);
                    const sData = await sRes.json();
                    const pEntry = sData.find(i => i.entityType === "PARK");
                    const isOpen = (pEntry && pEntry.status === "OPERATING");
                    resortData.status[p.n] = isOpen ? { label: "Open", class: "is-open" } : { label: "Closed", class: "is-closed" };

                    const rUrl = encodeURIComponent(`https://queue-times.com/parks/${p.id}/queue_times.json`);
                    const rRes = await fetch(PROXY + rUrl + cb);
                    const rData = await rRes.json();
                    let rides = [];
                    rData.lands.forEach(l => l.rides.forEach(r => rides.push(r)));

                    if (rides.length > 5) { // Ensure we got a real list
                        rides.sort((a,b) => b.wait_time - a.wait_time);
                        ridesHTML = rides.map(r => `
                            <div class="wait-item">
                                <span>${r.name.toUpperCase()}</span>
                                <span class="wait-val">${(r.is_open && isOpen) ? r.wait_time + ' MIN' : 'CLOSED'}</span>
                            </div>
                        `).join('');
                    }
                } catch (e) { console.warn("Syncing backup attractions for " + p.n); }

                if (!ridesHTML) {
                    ridesHTML = p.backup.map(name => `
                        <div class="wait-item">
                            <span>${name.toUpperCase()}</span>
                            <span class="wait-val">CLOSED</span>
                        </div>
                    `).join('');
                    if (!resortData.status[p.n]) resortData.status[p.n] = { label: "Closed", class: "is-closed" };
                }
                resortData.rides[p.n] = ridesHTML;
            }
            renderStatus();
            document.getElementById('last-update').innerText = "FULL ROSTER SYNC: " + new Date().toLocaleTimeString();
            if (curIdx === -1) rotate();
        }

        function renderStatus() {
            let html = '';
            parks.forEach(p => {
                const s = resortData.status[p.n] || { label: "Closed", class: "is-closed" };
                html += `<div class="status-item"><b>${p.n}</b><span class="status-pill ${s.class}">${s.label}</span></div>`;
            });
            document.getElementById('status-disp').innerHTML = html;
        }

        function rotate() {
            isPaused = true;
            curIdx = (curIdx + 1) % parks.length;
            const p = parks[curIdx];
            document.getElementById('p-name').innerText = p.n.toUpperCase();
            document.getElementById('wait-list').innerHTML = resortData.rides[p.n];
            scrollY = 0;
            direction = -1;
            document.getElementById('wait-list').style.transform = `translateY(0px)`;
            setTimeout(() => { isPaused = false; }, 3000); 
        }

        function animate() {
            if (isPaused) { requestAnimationFrame(animate); return; }
            const list = document.getElementById('wait-list');
            const containerHeight = document.querySelector('.scroll-window').offsetHeight;
            const listHeight = list.offsetHeight;
            const maxScroll = (listHeight - containerHeight) + 50;

            if (listHeight > containerHeight) {
                scrollY += (0.9 * direction); // Slightly faster for longer lists
                if (Math.abs(scrollY) >= maxScroll && direction === -1) {
                    isPaused = true; direction = 1;
                    setTimeout(() => { isPaused = false; }, 4000); 
                } else if (scrollY >= 0 && direction === 1) {
                    isPaused = true; direction = -1;
                    setTimeout(() => { isPaused = false; }, 4000);
                }
                list.style.transform = `translateY(${scrollY}px)`;
            }
            requestAnimationFrame(animate);
        }

        setInterval(() => {
            document.getElementById('p-clock').innerText = new Date().toLocaleTimeString([], {
                hour:'2-digit', minute:'2-digit', timeZone: 'America/New_York'
            });
        }, 1000);

        syncData(); 
        setInterval(syncData, 300000); 
        animate(); 
        setInterval(rotate, 65000); // 65 seconds per park to account for long lists
    </script>
</body>
</html>
