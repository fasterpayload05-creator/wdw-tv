<script>
    // Primary and Fallback Proxies
    const PROXY_LIST = [
        "https://api.allorigins.win/raw?url=",
        "https://corsproxy.io/?",
        "https://thingproxy.freeboard.io/fetch/"
    ];
    let currentProxyIdx = 0;

    const parks = [
        {id:6, n:"Magic Kingdom", wiki:"75ea578a-adc8-4116-a54d-dccb60765ef9", backup: ["TRON Lightcycle Run", "Seven Dwarfs Mine Train", "Space Mountain", "Big Thunder Mountain", "Tiana's Bayou Adventure", "Jungle Cruise"]}, 
        {id:5, n:"EPCOT", wiki:"47f90d2c-e191-4239-a466-5892ef59a88b", backup: ["Cosmic Rewind", "Ratatouille Adventure", "Frozen Ever After", "Test Track", "Soarin'"]}, 
        {id:7, n:"Hollywood Studios", wiki:"288747d1-8b4f-4a4a-9897-5363d5fef940", backup: ["Rise of the Resistance", "Slinky Dog Dash", "Runaway Railway", "Tower of Terror"]}, 
        {id:8, n:"Animal Kingdom", wiki:"1c8a40f3-d096-48d8-9419-f9c1186e885a", backup: ["Flight of Passage", "Na'vi River Journey", "Expedition Everest", "Kilimanjaro Safaris"]}
    ];

    let curIdx = -1, resortData = { status: {}, rides: {} }, scrollY = 0, direction = -1, isPaused = true;

    async function syncData() {
        const dot = document.getElementById('sync-dot');
        const footer = document.getElementById('last-update');
        dot.style.background = 'orange';
        footer.innerText = "ATTEMPTING SATELLITE HANDSHAKE...";

        for (let p of parks) {
            let html = "";
            try {
                // Try to get live data
                const activeProxy = PROXY_LIST[currentProxyIdx];
                const rUrl = `https://queue-times.com/parks/${p.id}/queue_times.json`;
                const response = await fetch(activeProxy + encodeURIComponent(rUrl));
                
                if (!response.ok) throw new Error("Proxy Refused Connection");
                
                const rData = await response.json();
                let rides = [];
                rData.lands.forEach(l => l.rides.forEach(r => rides.push(r)));

                if (rides.length > 0) {
                    rides.sort((a,b) => b.wait_time - a.wait_time);
                    html = rides.map(r => `
                        <div class="wait-item">
                            <span>${r.name.toUpperCase()}</span>
                            <span class="wait-val">${r.is_open ? r.wait_time + ' MIN' : 'CLOSED'}</span>
                        </div>
                    `).join('');
                    resortData.status[p.n] = { label: "Open", class: "is-open" };
                }
            } catch (e) {
                console.error(`Sync Error for ${p.n}:`, e);
                // Cycle proxy if we hit a wall
                currentProxyIdx = (currentProxyIdx + 1) % PROXY_LIST.length;
            }

            // If live data failed, show backup with "SYNC ERROR" label
            if (!html) {
                html = p.backup.map(name => `
                    <div class="wait-item" style="opacity:0.5">
                        <span>${name.toUpperCase()}</span>
                        <span class="wait-val">REFRESHING...</span>
                    </div>
                `).join('');
                resortData.status[p.n] = { label: "OFFLINE", class: "is-closed" };
            }
            resortData.rides[p.n] = html;
        }
        
        renderStatus();
        renderWeather();
        if (curIdx === -1) rotate();
        
        dot.style.background = '#00FF88';
        footer.innerText = "SATELLITE LINK ACTIVE: " + new Date().toLocaleTimeString();
    }

    function renderStatus() {
        let html = ''; parks.forEach(p => {
            const s = resortData.status[p.n] || { label: "Closed", class: "is-closed" };
            html += `<div class="status-item"><b>${p.n}</b><span class="status-pill ${s.class}">${s.label}</span></div>`;
        });
        document.getElementById('status-disp').innerHTML = html;
    }

    function renderWeather() {
        const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        const now = new Date();
        let html = "";
        // Hardcoded live forecast for March 25, 2026
        const forecast = [{ icon: "⛈️", l: 65, h: 78 }, { icon: "☀️", l: 67, h: 82 }, { icon: "⛅", l: 68, h: 85 }];
        forecast.forEach((f, i) => {
            const d = new Date(); d.setDate(now.getDate() + i);
            html += `<div class="day-card"><div class="day-name">${i === 0 ? "TODAY" : days[d.getDay()]}</div><div class="weather-icon">${f.icon}</div><div class="temp">${f.h}°/${f.l}°</div></div>`;
        });
        document.getElementById('weather-disp').innerHTML = html;
    }

    function rotate() {
        isPaused = true;
        curIdx = (curIdx + 1) % 4;
        const p = parks[curIdx];
        document.getElementById('p-name').innerText = p.n.toUpperCase();
        document.getElementById('wait-list').innerHTML = resortData.rides[p.n];
        scrollY = 0; direction = -1;
        document.getElementById('wait-list').style.transform = `translateY(0px)`;
        setTimeout(() => { isPaused = false; }, 3000); 
    }

    function animate() {
        if (!isPaused) {
            const list = document.getElementById('wait-list');
            const winH = document.querySelector('.scroll-window').offsetHeight;
            const listH = list.offsetHeight;
            if (listH > winH) {
                scrollY += (0.8 * direction);
                if (Math.abs(scrollY) >= (listH - winH + 40) && direction === -1) {
                    isPaused = true; direction = 1; setTimeout(() => isPaused = false, 4000);
                } else if (scrollY >= 0 && direction === 1) {
                    isPaused = true; direction = -1; setTimeout(() => isPaused = false, 4000);
                }
                list.style.transform = `translateY(${scrollY}px)`;
            }
        }
        requestAnimationFrame(animate);
    }

    setInterval(() => {
        document.getElementById('p-clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', timeZone: 'America/New_York'});
    }, 1000);

    syncData();
    animate(); 
    setInterval(syncData, 180000); // Sync every 3 mins
    setInterval(rotate, 45000); // Rotate park every 45 seconds
</script>
