<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDW Resort Information - Live Broadcast</title>
    <style>
        :root { 
            --disney-blue: #002266; 
            --disney-gold: #FFCC00; 
            --open-green: #00FF88; 
            --closed-red: #FF4444; 
            --glass: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            background: var(--disney-blue); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Header & Clock */
        .header { 
            width: 100%; 
            border-bottom: 6px solid var(--disney-gold); 
            background: linear-gradient(to bottom, #003399, #002266);
            display: flex; 
            justify-content: space-between; 
            padding: 20px 40px; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo { font-size: 42px; font-weight: 900; letter-spacing: 2px; }
        .clock-container { text-align: right; display: flex; align-items: center; gap: 15px; }
        .clock { font-size: 38px; color: var(--disney-gold); font-weight: bold; }
        .live-dot { 
            width: 12px; height: 12px; background: var(--open-green); 
            border-radius: 50%; box-shadow: 0 0 10px var(--open-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Main Grid Layout */
        .main-grid { display: flex; padding: 25px; height: calc(100vh - 160px); gap: 30px; }
        
        /* Left Column: Wait Times */
        .left-col { width: 50%; border-right: 4px solid var(--disney-gold); position: relative; display: flex; flex-direction: column; padding-right: 20px; }
        
        /* Right Column: Status & Weather */
        .right-col { width: 50%; display: flex; flex-direction: column; gap: 10px; }

        .section-title { 
            color: var(--disney-gold); 
            font-size: 22px; 
            font-weight: bold; 
            border-bottom: 3px solid var(--disney-gold); 
            margin-bottom: 12px; 
            text-transform: uppercase; 
            padding-bottom: 4px; 
            width: 100%; 
        }
        
        /* The Scrolling Mechanism */
        .scroll-window { 
            flex-grow: 1; 
            position: relative; 
            overflow: hidden; 
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); 
        }
        #wait-list { position: absolute; width: 100%; top: 0; will-change: transform; }
        .wait-item { 
            border-bottom: 1px solid rgba(255,255,255,0.15); 
            padding: 10px 0; 
            font-size: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .wait-val { color: var(--disney-gold); font-weight: 800; min-width: 95px; text-align: right; }

        /* Park Status Grid */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; width: 100%; }
        .status-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 6px 0; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .status-pill { padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; border: 2px solid currentColor; }
        
        /* Weather Cards */
        .day-card { 
            background: var(--glass); 
            padding: 15px; 
            border-radius: 8px; 
            border: 2px solid var(--disney-gold); 
            text-align: center;
        }
        .current-box { 
            width: 100%; display: flex; align-items: center; justify-content: space-around; 
            background: rgba(255, 204, 0, 0.1); margin-bottom: 5px;
        }
        .weather-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; width: 100%; }
        .day-name { font-weight: bold; color: var(--disney-gold); font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        .weather-icon { font-size: 40px; margin: 5px 0; }
        .temp { font-size: 18px; font-weight: bold; }
        .current-temp-large { font-size: 46px; font-weight: 900; }

        .is-open { color: var(--open-green); }
        .is-closed { color: var(--closed-red); opacity: 0.6; }
        
        .footer { 
            position: fixed; bottom: 8px; right: 20px; font-size: 11px; 
            opacity: 0.6; color: var(--disney-gold); font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">WALT DISNEY WORLD</div>
        <div class="clock-container">
            <div class="live-dot" id="sync-dot"></div>
            <div id="p-clock" class="clock">--:--</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="left-col">
            <div class="section-title" id="p-name">STATION STANDBY</div>
            <div class="scroll-window"><div id="wait-list">INITIALIZING SATELLITE...</div></div>
        </div>

        <div class="right-col">
            <div class="section-title">RESORT PARK STATUS</div>
            <div id="status-disp" class="status-grid">Connecting...</div>

            <div class="section-title">CURRENT CONDITIONS</div>
            <div class="day-card current-box">
                <div class="day-name" style="font-size: 18px;">ORLANDO</div>
                <div class="weather-icon" style="font-size: 56px;">⛈️</div>
                <div class="current-temp-large">78°</div>
            </div>

            <div class="section-title" style="margin-top:10px;">3-DAY FORECAST</div>
            <div class="weather-box" id="weather-disp"></div>
        </div>
    </div>

    <div class="footer" id="last-update">READY</div>

    <script>
        const PROXY = "https://api.allorigins.win/raw?url=";
        const parks = [
            {id:6, n:"Magic Kingdom", wiki:"75ea578a-adc8-4116-a54d-dccb60765ef9", backup: ["TRON Lightcycle Run", "Seven Dwarfs Mine Train", "Space Mountain", "Big Thunder Mountain", "Tiana's Bayou Adventure", "Jungle Cruise", "Peter Pan's Flight", "Haunted Mansion", "Pirates of the Caribbean", "Buzz Lightyear", "It's a Small World", "Under the Sea", "The Barnstormer", "Dumbo", "PeopleMover"]}, 
            {id:5, n:"EPCOT", wiki:"47f90d2c-e191-4239-a466-5892ef59a88b", backup: ["Cosmic Rewind", "Ratatouille Adventure", "Frozen Ever After", "Test Track", "Soarin'", "Spaceship Earth", "Mission: SPACE", "Journey into Imagination", "Living with the Land", "The Seas"]}, 
            {id:7, n:"Hollywood Studios", wiki:"288747d1-8b4f-4a4a-9897-5363d5fef940", backup: ["Rise of the Resistance", "Slinky Dog Dash", "Runaway Railway", "Tower of Terror", "Rock 'n' Roller Coaster", "Smugglers Run", "Toy Story Mania!", "Star Tours"]}, 
            {id:8, n:"Animal Kingdom", wiki:"1c8a40f3-d096-48d8-9419-f9c1186e885a", backup: ["Flight of Passage", "Na'vi River Journey", "Expedition Everest", "Kilimanjaro Safaris", "DINOSAUR", "Kali River Rapids", "It's Tough to be a Bug!"]},
            {id:null, n:"Blizzard Beach", wiki:"ae442f71-679e-4b02-aa11-197e8e50337b", backup: ["Summit Plummet", "Slush Gusher"]},
            {id:null, n:"Typhoon Lagoon", wiki:"09228678-005d-4561-8f6a-f1261d2d380e", backup: ["Closed for Season"]}
        ];

        let curIdx = -1, resortData = { status: {}, rides: {} }, scrollY = 0, direction = -1, isPaused = true;

        async function syncData() {
            document.getElementById('sync-dot').style.background = 'orange';
            for (let p of parks) {
                let html = "";
                try {
                    const sData = await fetch(PROXY + encodeURIComponent(`https://api.themeparks.wiki/v1/entity/${p.wiki}/live`) + "&cb=" + Date.now()).then(r => r.json());
                    const isOpen = sData.find(i => i.entityType === "PARK")?.status === "OPERATING";
                    resortData.status[p.n] = isOpen ? { label: "Open", class: "is-open" } : { label: "Closed", class: "is-closed" };
                    
                    if (p.id && isOpen) {
                        const rData = await fetch(PROXY + encodeURIComponent(`https://queue-times.com/parks/${p.id}/queue_times.json`) + "&cb=" + Date.now()).then(r => r.json());
                        let rides = []; rData.lands.forEach(l => l.rides.forEach(r => rides.push(r)));
                        if (rides.length > 3) {
                            rides.sort((a,b) => b.wait_time - a.wait_time);
                            html = rides.map(r => `<div class="wait-item"><span>${r.name.toUpperCase()}</span><span class="wait-val">${r.is_open ? r.wait_time + ' MIN' : 'CLOSED'}</span></div>`).join('');
                        }
                    }
                } catch (e) { console.warn("API Skip", p.n); }
                
                if (!html) {
                    html = p.backup.map(name => `<div class="wait-item"><span>${name.toUpperCase()}</span><span class="wait-val">CLOSED</span></div>`).join('');
                    resortData.status[p.n] = resortData.status[p.n] || { label: "Closed", class: "is-closed" };
                }
                resortData.rides[p.n] = html;
            }
            renderStatus();
            renderWeather();
            if (curIdx === -1) rotate();
            document.getElementById('sync-dot').style.background = '#00FF88';
            document.getElementById('last-update').innerText = "LIVE SYNC: " + new Date().toLocaleTimeString();
        }

        function renderStatus() {
            let html = ''; parks.forEach(p => {
                const s = resortData.status[p.n] || { label: "Closed", class: "is-closed" };
                html += `<div class="status-item"><b>${p.n}</b><span class="status-pill ${s.class}">${s.label}</span></div>`;
            });
            document.getElementById('status-disp').innerHTML = html;
        }

        function renderWeather() {
            const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            const now = new Date();
            let html = "";
            const forecast = [{ icon: "⛈️", l: 65, h: 78 }, { icon: "☀️", l: 67, h: 82 }, { icon: "⛅", l: 68, h: 85 }];
            forecast.forEach((f, i) => {
                const d = new Date(); d.setDate(now.getDate() + i);
                html += `<div class="day-card"><div class="day-name">${i === 0 ? "TODAY" : days[d.getDay()]}</div><div class="weather-icon">${f.icon}</div><div class="temp">${f.h}°/${f.l}°</div></div>`;
            });
            document.getElementById('weather-disp').innerHTML = html;
        }

        function rotate() {
            isPaused = true;
            curIdx = (curIdx + 1) % 4;
            const p = parks[curIdx];
            document.getElementById('p-name').innerText = p.n.toUpperCase();
            document.getElementById('wait-list').innerHTML = resortData.rides[p.n];
            scrollY = 0; direction = -1;
            document.getElementById('wait-list').style.transform = `translateY(0px)`;
            setTimeout(() => { isPaused = false; }, 3000); 
        }

        function animate() {
            if (!isPaused) {
                const list = document.getElementById('wait-list');
                const winH = document.querySelector('.scroll-window').offsetHeight;
                const listH = list.offsetHeight;
                if (listH > winH) {
                    scrollY += (0.8 * direction);
                    if (Math.abs(scrollY) >= (listH - winH + 40) && direction === -1) {
                        isPaused = true; direction = 1; setTimeout(() => isPaused = false, 4000);
                    } else if (scrollY >= 0 && direction === 1) {
                        isPaused = true; direction = -1; setTimeout(() => isPaused = false, 4000);
                    }
                    list.style.transform = `translateY(${scrollY}px)`;
                }
            }
            requestAnimationFrame(animate);
        }

        setInterval(() => {
            document.getElementById('p-clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', timeZone: 'America/New_York'});
        }, 1000);

        syncData();
        animate(); 
        setInterval(syncData, 300000);
        setInterval(rotate, 45000);
    </script>
</body>
</html>
