<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WDW Resort TV - Final Sync</title>
    <style>
        :root { --disney-blue: #002266; --disney-gold: #FFCC00; --open-green: #00FF88; --closed-red: #FF4444; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--disney-blue); color: white; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; }
        
        .header { width: 100%; border-bottom: 6px solid var(--disney-gold); background: #003399; display: flex; justify-content: space-between; padding: 15px 40px; align-items: center; }
        .logo { font-size: 32px; font-weight: 900; letter-spacing: 2px; }
        .clock { font-size: 30px; color: var(--disney-gold); font-weight: bold; }

        .main-grid { display: flex; padding: 20px; height: calc(100vh - 120px); gap: 25px; }
        .left-col { width: 50%; border-right: 4px solid var(--disney-gold); position: relative; display: flex; flex-direction: column; padding-right: 20px; }
        .right-col { width: 50%; display: flex; flex-direction: column; gap: 15px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--disney-gold); margin-bottom: 10px; padding-bottom: 4px; }
        .section-title { color: var(--disney-gold); font-size: 18px; font-weight: bold; text-transform: uppercase; margin: 0; }
        
        .sync-btn { background: var(--disney-gold); color: var(--disney-blue); border: none; padding: 4px 12px; font-size: 10px; font-weight: 900; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .sync-btn:hover { background: white; }
        .loading { opacity: 0.5; cursor: wait; pointer-events: none; }

        .scroll-window { flex-grow: 1; position: relative; overflow: hidden; mask-image: linear-gradient(to bottom, transparent, black 8%, black 92%, transparent); }
        #wait-list { position: absolute; width: 100%; top: 0; transition: transform 0.1s linear; }
        .wait-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 8px 0; font-size: 18px; display: flex; justify-content: space-between; }
        .wait-val { color: var(--disney-gold); font-weight: bold; }

        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .status-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 5px 0; display: flex; justify-content: space-between; font-size: 14px; }
        .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 900; border: 2px solid currentColor; }
        
        .weather-card { background: rgba(0,0,0,0.2); border-radius: 8px; border: 2px solid var(--disney-gold); padding: 12px; }
        .current-box { display: flex; align-items: center; justify-content: space-around; background: rgba(255,204,0,0.1); margin-bottom: 10px; }
        .weather-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

        .is-open { color: var(--open-green); }
        .is-closed { color: var(--closed-red); opacity: 0.6; }
        .sync-ts { font-size: 9px; color: var(--disney-gold); opacity: 0.5; margin-top: 4px; text-align: right; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">WALT DISNEY WORLD</div>
        <div id="p-clock" class="clock">--:--</div>
    </div>

    <div class="main-grid">
        <div class="left-col">
            <div class="section-header">
                <h2 class="section-title" id="p-name">STATION STANDBY</h2>
                <button id="btn-waits" class="sync-btn" onclick="syncWaitTimes()">Re-Sync Waits</button>
            </div>
            <div class="scroll-window"><div id="wait-list">SATELLITE SEARCHING...</div></div>
            <div id="ts-waits" class="sync-ts">WAIT SYNC: OFFLINE</div>
        </div>

        <div class="right-col">
            <div>
                <div class="section-header">
                    <h2 class="section-title">PARK STATUS</h2>
                    <button id="btn-status" class="sync-btn" onclick="syncStatus()">Re-Sync Status</button>
                </div>
                <div id="status-disp" class="status-grid">Connecting...</div>
                <div id="ts-status" class="sync-ts">STATUS SYNC: OFFLINE</div>
            </div>

            <div style="margin-top:10px;">
                <h2 class="section-title" style="border-bottom: 3px solid var(--disney-gold); margin-bottom:10px; padding-bottom:4px;">CURRENT CONDITIONS</h2>
                <div class="weather-card current-box">
                    <div style="font-weight:bold; color:var(--disney-gold)">ORLANDO</div>
                    <div id="cur-icon" style="font-size:44px;">⛅</div>
                    <div id="cur-temp" style="font-size:34px; font-weight:900;">74°</div>
                </div>
            </div>

            <div>
                <h2 class="section-title" style="border-bottom: 3px solid var(--disney-gold); margin-bottom:10px; padding-bottom:4px;">3-DAY FORECAST</h2>
                <div class="weather-box" id="weather-disp"></div>
            </div>
        </div>
    </div>

    <script>
        const parks = [
            {id:6, n:"Magic Kingdom", wiki:"75ea578a-adc8-4116-a54d-dccb60765ef9"}, 
            {id:5, n:"EPCOT", wiki:"47f90d2c-e191-4239-a466-5892ef59a88b"}, 
            {id:7, n:"Hollywood Studios", wiki:"288747d1-8b4f-4a4a-9897-5363d5fef940"}, 
            {id:8, n:"Animal Kingdom", wiki:"1c8a40f3-d096-48d8-9419-f9c1186e885a"}
        ];

        let curIdx = -1, resortData = { status: {}, rides: {} }, scrollY = 0, direction = -1, isPaused = true;

        // The "Cloud-Proxy" strategy
        async function cloudFetch(url) {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error();
            return await response.json();
        }

        async function syncWaitTimes() {
            const btn = document.getElementById('btn-waits');
            btn.classList.add('loading');
            btn.innerText = "SYNCING...";
            
            for (let p of parks) {
                try {
                    const data = await cloudFetch(`https://queue-times.com/parks/${p.id}/queue_times.json`);
                    let rides = [];
                    data.lands.forEach(l => l.rides.forEach(r => rides.push(r)));
                    rides.sort((a,b) => b.wait_time - a.wait_time);
                    resortData.rides[p.n] = rides.map(r => `
                        <div class="wait-item"><span>${r.name.toUpperCase()}</span><span class="wait-val">${r.is_open ? r.wait_time + ' MIN' : 'CLOSED'}</span></div>
                    `).join('');
                } catch (e) { resortData.rides[p.n] = `<div class="wait-item"><span>LINK TIMEOUT - RETRYING</span></div>`; }
            }
            if (curIdx === -1) rotate();
            document.getElementById('ts-waits').innerText = "WAIT SYNC: " + new Date().toLocaleTimeString();
            btn.classList.remove('loading');
            btn.innerText = "RE-SYNC WAITS";
        }

        async function syncStatus() {
            const btn = document.getElementById('btn-status');
            btn.classList.add('loading');
            btn.innerText = "SYNCING...";

            let html = '';
            for (let p of parks) {
                try {
                    const data = await cloudFetch(`https://api.themeparks.wiki/v1/entity/${p.wiki}/live`);
                    const park = data.find(i => i.entityType === "PARK") || data[0];
                    const isOpen = park.status === "OPERATING" || park.status === "OPEN";
                    const s = isOpen ? { l: "Open", c: "is-open" } : { l: "Closed", c: "is-closed" };
                    html += `<div class="status-item"><b>${p.n}</b><span class="status-pill ${s.c}">${s.l}</span></div>`;
                } catch (e) { html += `<div class="status-item"><b>${p.n}</b><span class="status-pill is-closed">RETRY</span></div>`; }
            }
            document.getElementById('status-disp').innerHTML = html;
            document.getElementById('ts-status').innerText = "STATUS SYNC: " + new Date().toLocaleTimeString();
            btn.classList.remove('loading');
            btn.innerText = "RE-SYNC STATUS";
        }

        function rotate() {
            isPaused = true;
            curIdx = (curIdx + 1) % 4;
            const p = parks[curIdx];
            document.getElementById('p-name').innerText = p.n.toUpperCase();
            document.getElementById('wait-list').innerHTML = resortData.rides[p.n] || "REFRESHING...";
            scrollY = 0; direction = -1;
            document.getElementById('wait-list').style.transform = `translateY(0px)`;
            setTimeout(() => { isPaused = false; }, 3000); 
        }

        function animate() {
            if (!isPaused) {
                const list = document.getElementById('wait-list');
                const winH = document.querySelector('.scroll-window').offsetHeight;
                const listH = list.offsetHeight;
                if (listH > winH) {
                    scrollY += (0.8 * direction);
                    if (Math.abs(scrollY) >= (listH - winH + 40) && direction === -1) {
                        isPaused = true; direction = 1; setTimeout(() => isPaused = false, 4000);
                    } else if (scrollY >= 0 && direction === 1) {
                        isPaused = true; direction = -1; setTimeout(() => isPaused = false, 4000);
                    }
                    list.style.transform = `translateY(${scrollY}px)`;
                }
            }
            requestAnimationFrame(animate);
        }

        // Clock & Intervals
        setInterval(() => {
            document.getElementById('p-clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', timeZone: 'America/New_York'});
        }, 1000);

        // Daily Forecast (Static for layout stability)
        function renderForecast() {
            const forecast = [{ i: "⛈️", h: 79 }, { i: "☀️", h: 82 }, { i: "⛅", h: 85 }];
            let html = "";
            forecast.forEach((f, i) => {
                const d = new Date(); d.setDate(d.getDate() + i);
                html += `<div class="day-card"><div>${i === 0 ? "TODAY" : "DAY "+(i+1)}</div><div style="font-size:26px">${f.i}</div><div style="font-weight:bold">${f.h}°</div></div>`;
            });
            document.getElementById('weather-disp').innerHTML = html;
        }

        // Boot
        renderForecast();
        syncWaitTimes();
        syncStatus();
        animate();
        setInterval(rotate, 45000);
    </script>
</body>
</html>
